dataCatalog:
  identifier: sdcc:Catalog_of_simple_data_catalog_Catalogs
  description: "This catalog provides an overview of Catalogs that use the simple_data_catalog\
    \ to publish their data. Contribution to this catalog is voluntary, but very much\
    \ appreciated. Adding your data catalog to this one helps other find eachother\
    \ and each others data. It allows us to build a community and make our data even\
    \ more findable. \n"
  title: Catalog of simple_data_catalog Catalogs
  license:
    title: https://creativecommons.org/licenses/by-sa/4.0/
  publisher:
    name: https://www.linkedin.com/in/joep-van-genuchten-a6836751/[Joep van Genuchten]
