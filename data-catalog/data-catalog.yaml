policies:
- uid: plcy:open-information-policy
  title: open information policy
  description: "Open Information policy for the project.  \nIt ensures that data is\
    \ Findable, Accessible, Interoperable, and Reusable (FAIR).\n"
  permission:
  - uid: plcy:open-info-access
    description: 'Allows any consumer to access the data.

      '
    action: access
    assignee:
    - Data Consumer
  obligation:
  - uid: plcy:register-in-catalog
    description: 'The publisher must register the data in the project catalog so it
      is findable.

      '
    action: register
    assignee:
    - Data Provider
  - uid: plcy:provide-license
    description: 'The publisher must provide an open‑source or Creative‑Commons licence

      describing how the data may be used.

      '
    action: provide
    assignee:
    - Data Provider
  - uid: plcy:provide-rights-statement
    description: 'The publisher must provide a rights statement (e.g., from rightsstatements.org)

      indicating any intellectual‑property or copy rights.

      '
    action: provide
    assignee:
    - Data Provider
  - uid: plcy:make-accessible
    description: 'The provider must make the data available through an appropriate

      protocol so that consumers can retrieve it without restriction.

      '
    action: make_available
    assignee:
    - Data Provider
